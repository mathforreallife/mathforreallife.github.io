<!doctype html>
<html lang="en-US">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Math For Real Life</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="stylesheet" href="/assets/css/site.css?v=ca81b74bdf">
<script src="/assets/js/config.js?v=df2440e069"></script>
<script src="/assets/js/site.js?v=1a71fcdc59" defer></script>
</head>
<body data-no-track>
<!-- One link for every country: opens the book in the visitor's own Amazon store. -->
<main class="wrap page-text center-page">
  <h1>Opening Amazon…</h1>
  <p>Taking you to <i>Math For Real Life</i> in your country's Amazon store.</p>
  <p class="actions404" data-list></p>
</main>
<script>
document.addEventListener("DOMContentLoaded", function () {
  var C = window.MFRL || {}, done = false;
  var list = document.querySelector("[data-list]");
  (C.stores || []).filter(function (s) { return s.url; }).forEach(function (s) {
    var a = document.createElement("a"); a.href = s.url; a.className = "btn-ghost"; a.textContent = s.name; list.appendChild(a);
  });
  function go(s) {
    if (done || !s) return;
    done = true;
    if (window.MFRLtrack) window.MFRLtrack("amazon", s.code + " via /amazon/");
    setTimeout(function () { location.replace(s.url); }, 150);
  }
  var first = null;
  if (window.MFRLpickStore) window.MFRLpickStore(function (s, fromCountry) { if (fromCountry) go(s); else first = s; });
  setTimeout(function () { go(first); }, 2100);  // no country answer: use the browser language
});
</script>
</body>
</html>
